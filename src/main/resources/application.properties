spring.config.import=optional:file:.env[.properties]
# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgresql}
spring.config.import=optional:file:./.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL / Neon
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${db.host}:${db.port}/${db.name}?sslmode=${db.sslmode}}
spring.datasource.driver-class-name=org.postgresql.Driver
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:postgres}
db.sslmode=${DB_SSLMODE:disable}

# =============================================
# Apache Kafka (Aiven / Local)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
spring.kafka.properties.ssl.keystore.location=${KAFKA_SSL_KEYSTORE_LOCATION:}
spring.kafka.properties.ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD:}
spring.kafka.properties.ssl.key.password=${KAFKA_SSL_KEY_PASSWORD:}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:user-events}

# =============================================
# API transaccional de Brevo
# =============================================
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
brevo.timeout.connect=${BREVO_CONNECT_TIMEOUT:2s}
brevo.timeout.read=${BREVO_READ_TIMEOUT:5s}
brevo.retry.max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry.initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry.multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-breaker.failure-rate-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-breaker.sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-breaker.minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-breaker.open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
